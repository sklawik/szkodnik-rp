version: '3.8'

services:
  mysql:
    image: mysql:8
    container_name: szkodnikrp-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: szkodnikrp
      MYSQL_USER: www
      MYSQL_PASSWORD: 123
    ports:
      - "3306:3306"
    command: >
      --default-authentication-plugin=mysql_native_password
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
