

networks:
  szkodnikrp-net:

services:
  db:
    image: mysql:8
    container_name: szkodnikrp-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: example
    volumes:
      - szkodnikrp-db_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    networks:
      - szkodnikrp-net

  samp:
    build: .
    container_name: szkodnikrp-samp
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "7777:7777/udp"
    volumes:
      - .:/app
    environment:
      DB_HOST: db
      DB_USER: samp
      DB_PASS: example
      DB_NAME: szkodnikrp
    networks:
      - szkodnikrp-net

volumes:
  szkodnikrp-db_data:
